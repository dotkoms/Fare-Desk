# New York corridor: 30 routes from JFK and LGA, one search per route per day.
# Copy to data/watchlist.yaml (gitignored) for the collector:
#   cp data/watchlist.nyc.yaml data/watchlist.yaml
# Routes are in priority order. On a small daily quota (the free tier is ~8 searches a day)
# the collector starts one route further down each day, so all 30 are sampled over time.
# date_window is the travel window it rotates through; move it forward every few months.

home_airports: [JFK, LGA, EWR]
currency: USD

baseline:
  window_days: 90
  min_observations: 14

routes:
  - name: New York to Los Angeles
    origin: [JFK]
    destination: [LAX]
    date_window: 2026-12-01/2027-03-31
    bags: carry_on

